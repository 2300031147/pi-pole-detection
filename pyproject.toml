[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-pole-detection"
version = "0.1.0"
description = "Rule-based pole voltage inference for Raspberry Pi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
pi-pole-detect = "pi_pole_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
